# ==========================================
# 1. FUENTE DE DATOS
# ==========================================
sources:
  bigquery_logistica_sbx:
    kind: bigquery
    project: tot-corp-plo-sbx

# ==========================================
# 2. DEFINICIÓN DE HERRAMIENTAS MCP
# ==========================================
tools:
  # ----------------------------------------------------
  # HERRAMIENTA 1: Detalle de despachos y pedidos en tránsito
  # ----------------------------------------------------
  consultar_despachos_logistica:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Consulta el detalle de despachos y transferencias en tránsito desde el CD 
      hacia las tiendas en los últimos 31 días. Devuelve SKU, descripción, unidades, 
      cajas, peso, placa de transporte y fecha de envío. Permite buscar por TIM, 
      tienda, SKU o placa.
    parameters:
      - name: tim
        type: integer
        description: "Número identificador del TIM logístico (ej. 655425244). Enviar null o 0 si no se tiene."
        required: false
      - name: tienda
        type: string
        description: "ID de la tienda destino como texto (ej. '123', '114', '104'). Opcional si se especifica TIM o placa."
        required: false
      - name: sku
        type: string
        description: "Código SKU del producto. Opcional para rastrear un artículo puntual."
        required: false
      - name: placa
        type: string
        description: "Placa del camión de transporte. Opcional para filtrar por vehículo."
        required: false
      - name: pagina
        type: integer
        description: "Número de página específica (50 filas por página). Dejar vacío o null para obtener todos los registros sin paginar."
        required: false
    statement: |
      WITH datos AS (
        SELECT 
            tim,
            Shipment, 
            Placa,
            sku, 
            Descripcion,
            Trf_DO,
            Tipo_DO,
            Inventario_Whse, 
            Tienda,
            Nombre_Tienda, 
            Fecha_Enviado,
            FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', Hora_de_Carga, 'America/Lima') AS hora_carga,
            ROW_NUMBER() OVER(ORDER BY Fecha_Enviado DESC, sku) AS num_fila
        FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
        WHERE (
            (Fecha_Enviado <= CURRENT_DATE("America/Lima") AND Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 31 DAY))
            OR (Hora_de_Carga >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 31 DAY) AND Fecha_Enviado IS NULL)
          )
          AND (@tim IS NULL OR @tim = 0 OR Tim = @tim)
          AND (@tienda IS NULL OR @tienda = '' OR Tienda = @tienda)
          AND (@sku IS NULL OR @sku = '' OR sku = @sku)
          AND (@placa IS NULL OR @placa = '' OR UPPER(TRIM(Placa)) = UPPER(TRIM(@placa)))
      )
      SELECT 
          tim,
          Shipment, 
          Placa,
          sku, 
          Descripcion,
          Trf_DO,
          Tipo_DO,
          Inventario_Whse, 
          Tienda,
          Nombre_Tienda, 
          Fecha_Enviado,
          hora_carga
      FROM datos
      WHERE (@pagina IS NULL OR @pagina = 0 OR num_fila BETWEEN (@pagina - 1) * 50 + 1 AND @pagina * 50)
      ORDER BY num_fila
      LIMIT 5000;

  # ----------------------------------------------------
  # HERRAMIENTA 2: Consolidado de carga por Camión (Placa) o TIM
  # ----------------------------------------------------
  resumen_carga_transporte:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Calcula el consolidado de carga por camión (placa) o TIM de despacho hacia una tienda.
      Devuelve fecha de despacho, hora de carga en CD (hora_carga), bultos, cajas, unidades, peso y volumen.
    parameters:
      - name: tim
        type: integer
        description: "Número TIM de la transferencia. Opcional si se busca por placa o tienda."
        required: false
      - name: placa
        type: string
        description: "Placa del camión de transporte. Opcional si se busca por TIM."
        required: false
      - name: tienda
        type: string
        description: "Código ID de la tienda destino (ej. '123' para Angamos, '451' para Huanuco). Opcional."
        required: false
      - name: fecha
        type: string
        description: "Fecha específica de despacho o fecha de inicio en formato YYYY-MM-DD (ej. '2026-09-26'). Opcional."
        required: false
      - name: fecha_fin
        type: string
        description: "Fecha final en formato YYYY-MM-DD cuando se consulta un rango de fechas (ej. '2026-09-30'). Opcional."
        required: false
      - name: pagina
        type: integer
        description: "Número de página a consultar (1 para filas 1-50, 2 para filas 51-100, etc.). Opcional."
        required: false
    statement: |
      WITH datos AS (
        SELECT 
            tim,
            Placa,
            Tienda,
            Nombre_Tienda,
            Inventario_Whse,
            DATE(Fecha_Enviado) AS fecha_despacho,
            FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', MIN(Hora_de_Carga), 'America/Lima') AS hora_carga,
            COUNT(DISTINCT Pallet) AS total_pallets,
            COUNT(DISTINCT sku) AS total_skus_distintos,
            ROUND(SUM(Unidades), 0) AS total_unidades,
            ROUND(SUM(Cajas), 0) AS total_cajas,
            ROUND(SUM(Peso_Total), 2) AS peso_total_kg,
            ROUND(SUM(Vol_Enviado), 2) AS volumen_total_m3
        FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
        WHERE (
            Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 31 DAY)
            OR (Hora_de_Carga >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 31 DAY) AND Fecha_Enviado IS NULL)
          )
          AND (@tim IS NULL OR @tim = 0 OR Tim = @tim)
          AND (@placa IS NULL OR @placa = '' OR UPPER(TRIM(Placa)) = UPPER(TRIM(@placa)))
          AND (@tienda IS NULL OR @tienda = '' OR Tienda = @tienda)
          AND (
            (@fecha IS NULL OR @fecha = '')
            OR (@fecha_fin IS NOT NULL AND @fecha_fin != '' AND DATE(Fecha_Enviado) >= DATE(@fecha) AND DATE(Fecha_Enviado) <= DATE(@fecha_fin))
            OR ((@fecha_fin IS NULL OR @fecha_fin = '') AND (
                 CAST(DATE(Fecha_Enviado) AS STRING) = @fecha
                 OR CAST(DATE(Fecha_Enviado) AS STRING) LIKE CONCAT('%', @fecha, '%')
            ))
          )
        GROUP BY tim, Placa, Tienda, Nombre_Tienda, Inventario_Whse, DATE(Fecha_Enviado)
      ),
      numerados AS (
        SELECT 
            *,
            ROW_NUMBER() OVER(ORDER BY fecha_despacho DESC, hora_carga DESC, total_cajas DESC) AS num_fila
        FROM datos
      )
      SELECT 
          tim,
          Placa,
          Tienda,
          Nombre_Tienda,
          Inventario_Whse,
          fecha_despacho,
          hora_carga,
          total_pallets,
          total_skus_distintos,
          total_unidades,
          total_cajas,
          peso_total_kg,
          volumen_total_m3
      FROM numerados
      WHERE (@pagina IS NULL OR @pagina = 0 OR num_fila BETWEEN (@pagina - 1) * 50 + 1 AND @pagina * 50)
      ORDER BY num_fila;

  # ----------------------------------------------------
  # HERRAMIENTA 3: Despachos agregados por División Comercial (J01 a J11)
  # ----------------------------------------------------
  resumen_despachos_por_division:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Permite saber cuántas unidades y cajas se han despachado a una tienda 
      desglosado por división comercial (ej. Carnes, Abarrotes, etc.) en los últimos N días.
    parameters:
      - name: tienda
        type: string
        description: "ID de la tienda destino (ej. '123', '114')."
        required: true
      - name: dias_atras
        type: integer
        description: "Rango de días hacia atrás a consultar (por defecto 7 días)."
        required: false
    statement: |
      SELECT 
          Division,
          COUNT(DISTINCT sku) AS total_skus,
          ROUND(SUM(Unidades), 0) AS total_unidades,
          ROUND(SUM(Cajas), 0) AS total_cajas,
          ROUND(SUM(Peso_Total), 2) AS peso_total_kg,
          COUNT(DISTINCT tim) AS total_envios_tim
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL COALESCE(@dias_atras, 7) DAY)
        AND Tienda = @tienda
      GROUP BY Division
      ORDER BY total_unidades DESC;

  # ----------------------------------------------------
  # HERRAMIENTA 4: Control de Calidad y Vencimiento en Tránsito
  # ----------------------------------------------------
  alertas_vencimiento_transito:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Identifica productos en despacho o tránsito cuya fecha de vencimiento esté 
      próxima (dentro de los próximos N días) para alertar al gerente de tienda sobre perecibles.
    parameters:
      - name: tienda
        type: string
        description: "ID de la tienda destino (ej. '123')."
        required: true
      - name: dias_margen
        type: integer
        description: "Días máximos antes del vencimiento para considerarlo alerta (por defecto 15 días)."
        required: false
    statement: |
      SELECT 
          sku,
          Descripcion,
          Division,
          Fecha_Vencimiento,
          DATE_DIFF(Fecha_Vencimiento, CURRENT_DATE("America/Lima"), DAY) AS dias_para_vencer,
          Unidades,
          Cajas,
          tim,
          Placa,
          Fecha_Enviado
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 15 DAY)
        AND Tienda = @tienda
        AND Fecha_Vencimiento IS NOT NULL
        AND Fecha_Vencimiento <= DATE_ADD(CURRENT_DATE("America/Lima"), INTERVAL COALESCE(@dias_margen, 15) DAY)
      ORDER BY Fecha_Vencimiento ASC
      LIMIT 50;

  # ----------------------------------------------------
  # HERRAMIENTA 5: Rastreo por Shipment o Delivery Order (Trf_DO)
  # ----------------------------------------------------
  buscar_por_shipment_o_do:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Permite rastrear despachos cuando el usuario no tiene el número de TIM,
      pero cuenta con el identificador del Shipment o el número de Trf_DO (Delivery Order).
      Devuelve el TIM asociado, placa del camión, tienda destino, fecha de despacho y resumen de carga.
    parameters:
      - name: shipment
        type: string
        description: "Identificador del shipment o embarque logístico (ej. '90327449')."
        required: false
      - name: trf_do
        type: string
        description: "Número de transferencia u orden de entrega Delivery Order (ej. '22796787', '22798429')."
        required: false
    statement: |
      SELECT 
          tim,
          Shipment, 
          Trf_DO,
          Tipo_DO,
          Placa,
          Tienda,
          Nombre_Tienda,
          Inventario_Whse,
          FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', MIN(Hora_de_Carga), 'America/Lima') AS hora_carga,
          DATE(Fecha_Enviado) AS fecha_despacho,
          COUNT(DISTINCT sku) AS total_skus,
          ROUND(SUM(Unidades), 0) AS total_unidades,
          ROUND(SUM(Cajas), 0) AS total_cajas,
          ROUND(SUM(Peso_Total), 2) AS peso_total_kg
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE (
          Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 31 DAY)
          OR (Hora_de_Carga >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 31 DAY) AND Fecha_Enviado IS NULL)
        )
        AND (@shipment IS NULL OR @shipment = '' OR CAST(Shipment AS STRING) = @shipment)
        AND (@trf_do IS NULL OR @trf_do = '' OR CAST(Trf_DO AS STRING) = @trf_do)
      GROUP BY tim, Shipment, Trf_DO, Tipo_DO, Placa, Tienda, Nombre_Tienda, Inventario_Whse, DATE(Fecha_Enviado)
      LIMIT 20;

  # ----------------------------------------------------
  # HERRAMIENTA 6: Búsqueda y Resolución de Tiendas por Nombre
  # ----------------------------------------------------
  buscar_tienda_por_nombre:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Busca tiendas de Tottus por coincidencia parcial de su nombre comercial
      (ej. 'Huanuco', 'San Luis', 'Angamos', 'Megaplaza') para obtener su código numérico ID de tienda.
    parameters:
      - name: nombre_parcial
        type: string
        description: "Nombre o palabra clave del local/tienda a buscar (ej. 'Huanuco', 'San Luis', 'Angamos')."
        required: true
    statement: |
      SELECT 
          Tienda AS tienda_id,
          Nombre_Tienda,
          COUNT(DISTINCT tim) AS total_despachos_recientes,
          MAX(Fecha_Enviado) AS ultimo_despacho_registrado
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 31 DAY)
        AND LOWER(Nombre_Tienda) LIKE CONCAT('%', LOWER(@nombre_parcial), '%')
      GROUP BY Tienda, Nombre_Tienda
      ORDER BY total_despachos_recientes DESC
      LIMIT 10;

  # ----------------------------------------------------
  # HERRAMIENTA 7: Camiones y TIMs cargados pendientes de despacho
  # ----------------------------------------------------
  consultar_cargas_pendientes_despacho:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Identifica camiones (placas) y transferencias (TIMs) que ya fueron cargados 
      en el Centro de Distribución (CD) pero que aún NO cuentan con fecha de envío o salida 
      (Hora_de_Carga registrada pero Fecha_Enviado es nula o pendiente) hasta el día de hoy. 
      Permite saber qué camiones están cargados en espera de despacho.
    parameters:
      - name: tienda
        type: string
        description: "Código ID de la tienda destino (ej. '123', '107'). Opcional para ver todas las tiendas."
        required: false
      - name: placa
        type: string
        description: "Placa del camión de transporte. Opcional."
        required: false
      - name: dias_atras
        type: integer
        description: "Días hacia atrás a consultar para cargas pendientes (por defecto 15 días)."
        required: false
    statement: |
      WITH datos AS (
        SELECT 
            tim,
            Placa,
            Tienda,
            Nombre_Tienda,
            Inventario_Whse,
            FORMAT_TIMESTAMP('%Y-%m-%d %H:%M', MIN(Hora_de_Carga), 'America/Lima') AS hora_carga,
            COUNT(DISTINCT Pallet) AS total_pallets,
            COUNT(DISTINCT sku) AS total_skus_distintos,
            ROUND(SUM(Unidades), 0) AS total_unidades,
            ROUND(SUM(Cajas), 0) AS total_cajas,
            ROUND(SUM(Peso_Total), 2) AS peso_total_kg,
            ROUND(SUM(Vol_Enviado), 2) AS volumen_total_m3
        FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
        WHERE Hora_de_Carga IS NOT NULL
          AND (Fecha_Enviado IS NULL OR Fecha_Enviado > CURRENT_DATE("America/Lima"))
          AND Hora_de_Carga >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL COALESCE(@dias_atras, 15) DAY)
          AND (@tienda IS NULL OR @tienda = '' OR Tienda = @tienda)
          AND (@placa IS NULL OR @placa = '' OR UPPER(TRIM(Placa)) = UPPER(TRIM(@placa)))
        GROUP BY tim, Placa, Tienda, Nombre_Tienda, Inventario_Whse
      )
      SELECT 
          tim,
          Placa,
          Tienda,
          Nombre_Tienda,
          Inventario_Whse,
          hora_carga,
          total_pallets,
          total_skus_distintos,
          total_unidades,
          total_cajas,
          peso_total_kg,
          volumen_total_m3
      FROM datos
      ORDER BY hora_carga DESC
      LIMIT 100;

# ==========================================
# 3. REGISTRO EN EL TOOLSET
# ==========================================
toolsets:
  insights_operativos:
    - consultar_despachos_logistica
    - resumen_carga_transporte
    - resumen_despachos_por_division
    - alertas_vencimiento_transito
    - buscar_por_shipment_o_do
    - buscar_tienda_por_nombre
    - consultar_cargas_pendientes_despacho