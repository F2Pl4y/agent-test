# ==========================================
# 1. FUENTE DE DATOS
# ==========================================
sources:
  bigquery_logistica_sbx:
    kind: bigquery
    project: tot-corp-plo-sbx

# ==========================================
# 2. DEFINICIÓN DE HERRAMIENTAS MCP
# ==========================================
tools:
  # ----------------------------------------------------
  # HERRAMIENTA 1: Detalle de despachos y pedidos en tránsito
  # ----------------------------------------------------
  consultar_despachos_logistica:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Consulta el detalle de despachos y transferencias en tránsito desde el CD 
      hacia las tiendas en los últimos 60 días. Devuelve SKU, descripción, unidades, 
      cajas, peso, placa de transporte y fecha de envío. Permite buscar por TIM, 
      tienda, SKU o placa.
    parameters:
      - name: tim
        type: integer
        description: "Número identificador del TIM logístico (ej. 655425244). Enviar null o 0 si no se tiene."
        required: false
      - name: tienda
        type: string
        description: "ID de la tienda destino como texto (ej. '123', '114', '104'). Opcional si se especifica TIM o placa."
        required: false
      - name: sku
        type: string
        description: "Código SKU del producto. Opcional para rastrear un artículo puntual."
        required: false
      - name: placa
        type: string
        description: "Placa del vehículo/camión de transporte. Opcional."
        required: false
    statement: |
      SELECT 
          tim,
          Shipment,
          Placa,
          sku, 
          Descripcion,
          Division,
          Departamento,
          Unidades,
          Cajas,
          ROUND(Peso_Total, 2) AS peso_total_kg,
          ROUND(Vol_Enviado, 2) AS volumen_m3,
          Fecha_Vencimiento,
          Tienda,
          Nombre_Tienda, 
          Inventario_Whse,
          Fecha_Enviado,
          Hora_de_Enviado,
          Trf_DO,
          Tipo_DO
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 60 DAY)
        AND (@tim IS NULL OR @tim = 0 OR Tim = @tim)
        AND (@tienda IS NULL OR @tienda = '' OR Tienda = @tienda)
        AND (@sku IS NULL OR @sku = '' OR sku = @sku)
        AND (@placa IS NULL OR @placa = '' OR Placa = @placa)
      ORDER BY Fecha_Enviado DESC, Hora_de_Enviado DESC
      LIMIT 100;

  # ----------------------------------------------------
  # HERRAMIENTA 2: Consolidado de carga por Camión (Placa) o TIM
  # ----------------------------------------------------
  resumen_carga_transporte:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Calcula el total de bultos, cajas, unidades, peso total y volumen cargado en un 
      camión o TIM de despacho hacia una tienda. Ideal para saber qué tan lleno va el camión.
    parameters:
      - name: tim
        type: integer
        description: "Número TIM de la transferencia. Opcional si se busca por placa."
        required: false
      - name: placa
        type: string
        description: "Placa del camión de transporte. Opcional si se busca por TIM."
        required: false
    statement: |
      SELECT 
          tim,
          Placa,
          Tienda,
          Nombre_Tienda,
          Inventario_Whse,
          DATE(Fecha_Enviado) AS fecha_despacho,
          COUNT(DISTINCT Pallet) AS total_pallets,
          COUNT(DISTINCT sku) AS total_skus_distintos,
          ROUND(SUM(Unidades), 0) AS total_unidades,
          ROUND(SUM(Cajas), 0) AS total_cajas,
          ROUND(SUM(Peso_Total), 2) AS peso_total_kg,
          ROUND(SUM(Vol_Enviado), 2) AS volumen_total_m3
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 60 DAY)
        AND (@tim IS NULL OR @tim = 0 OR Tim = @tim)
        AND (@placa IS NULL OR @placa = '' OR Placa = @placa)
      GROUP BY tim, Placa, Tienda, Nombre_Tienda, Inventario_Whse, DATE(Fecha_Enviado)
      LIMIT 20;

  # ----------------------------------------------------
  # HERRAMIENTA 3: Despachos agregados por División Comercial (J01 a J11)
  # ----------------------------------------------------
  resumen_despachos_por_division:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Permite saber cuántas unidades y cajas se han despachado a una tienda 
      desglosado por división comercial (ej. Carnes, Abarrotes, etc.) en los últimos N días.
    parameters:
      - name: tienda
        type: string
        description: "ID de la tienda destino (ej. '123', '114')."
        required: true
      - name: dias_atras
        type: integer
        description: "Rango de días hacia atrás a consultar (por defecto 7 días)."
        required: false
    statement: |
      SELECT 
          Division,
          COUNT(DISTINCT sku) AS total_skus,
          ROUND(SUM(Unidades), 0) AS total_unidades,
          ROUND(SUM(Cajas), 0) AS total_cajas,
          ROUND(SUM(Peso_Total), 2) AS peso_total_kg,
          COUNT(DISTINCT tim) AS total_envios_tim
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL COALESCE(@dias_atras, 7) DAY)
        AND Tienda = @tienda
      GROUP BY Division
      ORDER BY total_unidades DESC;

  # ----------------------------------------------------
  # HERRAMIENTA 4: Control de Calidad y Vencimiento en Tránsito
  # ----------------------------------------------------
  alertas_vencimiento_transito:
    kind: bigquery-sql
    source: bigquery_logistica_sbx
    description: >
      Identifica productos en despacho o tránsito cuya fecha de vencimiento esté 
      próxima (dentro de los próximos N días) para alertar al gerente de tienda sobre perecibles.
    parameters:
      - name: tienda
        type: string
        description: "ID de la tienda destino (ej. '123')."
        required: true
      - name: dias_margen
        type: integer
        description: "Días máximos antes del vencimiento para considerarlo alerta (por defecto 15 días)."
        required: false
    statement: |
      SELECT 
          sku,
          Descripcion,
          Division,
          Fecha_Vencimiento,
          DATE_DIFF(Fecha_Vencimiento, CURRENT_DATE("America/Lima"), DAY) AS dias_para_vencer,
          Unidades,
          Cajas,
          tim,
          Placa,
          Fecha_Enviado
      FROM `tot-corp-plo-sbx.tot_bi_logistica_pe.FT_LOG_SALIDAS` 
      WHERE Fecha_Enviado >= DATE_SUB(CURRENT_DATE("America/Lima"), INTERVAL 15 DAY)
        AND Tienda = @tienda
        AND Fecha_Vencimiento IS NOT NULL
        AND Fecha_Vencimiento <= DATE_ADD(CURRENT_DATE("America/Lima"), INTERVAL COALESCE(@dias_margen, 15) DAY)
      ORDER BY Fecha_Vencimiento ASC
      LIMIT 50;

# ==========================================
# 3. REGISTRO EN EL TOOLSET
# ==========================================
toolsets:
  insights_operativos:
    - consultar_despachos_logistica
    - resumen_carga_transporte
    - resumen_despachos_por_division
    - alertas_vencimiento_transito